services:
  migration-backend:
    build: ./backend
    image: cloud-migration-backend:latest
    container_name: practical-11-migration-backend
    networks:
      - migration-net

  nginx:
    image: nginx:1.27-alpine
    container_name: practical-11-nginx
    ports:
      - "${HOST_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - migration-net
    depends_on:
      - migration-backend

networks:
  migration-net:
    name: practical-11-migration-net
