services:
  models-backend:
    build: ./backend
    image: cloud-service-models-backend:latest
    container_name: practical-01-models-backend
    networks:
      - models-net

  nginx:
    image: nginx:1.27-alpine
    container_name: practical-01-nginx
    ports:
      - "${HOST_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - models-net
    depends_on:
      - models-backend

networks:
  models-net:
    name: practical-01-models-net
