services:
  container-backend:
    build: ./backend
    image: cloud-container-microservice:latest
    container_name: practical-03-container-backend
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
    mem_limit: 128m
    cpus: 0.50
    networks:
      - container-net

  nginx:
    image: nginx:1.27-alpine
    container_name: practical-03-nginx
    ports:
      - "${HOST_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - container-net
    depends_on:
      - container-backend

networks:
  container-net:
    name: practical-03-container-net
