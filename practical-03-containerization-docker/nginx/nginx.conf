worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    upstream backend_svc {
        server container-backend:5000;
    }

    server {
        listen 80;
        server_name localhost;

        # Frontend static files
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Backend API proxy
        location /api/ {
            proxy_pass http://backend_svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Syllabus / CLI direct endpoints
        location /healthz {
            proxy_pass http://backend_svc/healthz;
            proxy_set_header Host $host;
        }

        location /system-metrics {
            proxy_pass http://backend_svc/system-metrics;
            proxy_set_header Host $host;
        }

        location /status {
            proxy_pass http://backend_svc/;
            proxy_set_header Host $host;
        }
    }
}
