services:
  faas-backend:
    build: ./backend
    image: faas-serverless-backend:latest
    container_name: practical-12-faas-backend
    networks:
      - faas-net

  nginx:
    image: nginx:1.27-alpine
    container_name: practical-12-nginx
    ports:
      - "${HOST_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - faas-net
    depends_on:
      - faas-backend

networks:
  faas-net:
    name: practical-12-faas-net
