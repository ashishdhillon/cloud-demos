services:
  security-backend:
    build: ./backend
    image: cloud-security-backend:latest
    container_name: practical-08-security-backend
    networks:
      - security-net

  nginx:
    image: nginx:1.27-alpine
    container_name: practical-08-nginx
    ports:
      - "${HOST_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - security-net
    depends_on:
      - security-backend

networks:
  security-net:
    name: practical-08-security-net
