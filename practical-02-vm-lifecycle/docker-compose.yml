services:
  vm-backend:
    build: ./backend
    image: vm-hypervisor-backend:latest
    container_name: practical-02-vm-backend
    networks:
      - vm-net

  nginx:
    image: nginx:1.27-alpine
    container_name: practical-02-nginx
    ports:
      - "${HOST_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - vm-net
    depends_on:
      - vm-backend

networks:
  vm-net:
    name: practical-02-vm-net
