services:
  terraform-backend:
    build: ./backend
    image: multicloud-terraform-backend:latest
    container_name: practical-14-terraform-backend
    networks:
      - terraform-net

  nginx:
    image: nginx:1.27-alpine
    container_name: practical-14-nginx
    ports:
      - "${HOST_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - terraform-net
    depends_on:
      - terraform-backend

networks:
  terraform-net:
    name: practical-14-terraform-net
