services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: practical-15-mosquitto
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - edge-net

  edge-gateway:
    build: ./edge_service
    image: edge-telemetry-gateway:latest
    container_name: practical-15-edge-gateway
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
    networks:
      - edge-net
    depends_on:
      - mosquitto

  nginx:
    image: nginx:1.27-alpine
    container_name: practical-15-nginx
    ports:
      - "${HOST_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - edge-net
    depends_on:
      - edge-gateway
      - mosquitto

networks:
  edge-net:
    name: practical-15-edge-net
