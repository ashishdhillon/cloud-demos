services:
  vpc-backend:
    build: ./backend
    image: cloud-vpc-backend:latest
    container_name: practical-05-vpc-backend
    networks:
      - vpc-net

  nginx:
    image: nginx:1.27-alpine
    container_name: practical-05-nginx
    ports:
      - "${HOST_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - vpc-net
    depends_on:
      - vpc-backend

networks:
  vpc-net:
    name: practical-05-vpc-net
