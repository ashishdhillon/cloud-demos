services:
  iam-backend:
    build: ./backend
    image: iam-policy-backend:latest
    container_name: practical-07-iam-backend
    networks:
      - iam-net

  nginx:
    image: nginx:1.27-alpine
    container_name: practical-07-nginx
    ports:
      - "${HOST_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - iam-net
    depends_on:
      - iam-backend

networks:
  iam-net:
    name: practical-07-iam-net
