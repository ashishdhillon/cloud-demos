services:
  analytics-backend:
    build: ./backend
    image: cloud-bigdata-analytics:latest
    container_name: practical-13-analytics-backend
    networks:
      - analytics-net

  nginx:
    image: nginx:1.27-alpine
    container_name: practical-13-nginx
    ports:
      - "${HOST_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - analytics-net
    depends_on:
      - analytics-backend

networks:
  analytics-net:
    name: practical-13-analytics-net
